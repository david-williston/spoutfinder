params:
  mainSections: [docs, source]
  description: "A historical archive: SpoutFinder, a 1994 BCIT CAD/CAM student project written in AutoLISP for AutoCAD Release 12 on a 486 PC"
  defaultTheme: dark
  ShowReadingTime: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  homeInfoParams:
    Title: SpoutFinder
    Content: >
      A historical archive. In 1994 a student at BCIT wrote a program in
      AutoLISP, inside AutoCAD Release 12 for DOS on a 486 PC, to decide
      where a shoe-sole pouring machine should put its spouts. This site
      keeps the proposal, the reports and the code as a look at how
      engineering was done when computers were slow and expensive and
      "printing" meant ink on paper.
