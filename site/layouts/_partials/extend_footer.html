<div class="cmdline" aria-hidden="true">
  <span>Command: <span id="cmdtext"></span><span class="cursor"></span></span>
  <span class="coords" id="coords">X: 0000.0000  Y: 0000.0000  Z: 0.0000</span>
</div>
<script>
  (function () {
    var el = document.getElementById("coords");
    document.addEventListener("mousemove", function (e) {
      var x = (e.clientX / 8).toFixed(4).padStart(9, "0");
      var y = ((window.innerHeight - e.clientY) / 8).toFixed(4).padStart(9, "0");
      el.textContent = "X: " + x + "  Y: " + y + "  Z: 0.0000";
    });
  })();
</script>
<script>
(function () {
  var root = document.documentElement;
  if (!root.classList.contains("x486")) return;
  var main = document.querySelector("main.main");
  var cmd = document.getElementById("cmdtext");
  function done() { root.classList.add("x486-run"); if (cmd) cmd.textContent = ""; }
  if (!main) { done(); return; }

  /* top-level blocks of whatever this page is made of */
  var sel = [".page-header > *", ".post-header > *", ".post-content > *", ".home-info > *",
             ".post-entry", ".post-meta", ".toc", ".breadcrumbs"].join(",");
  var set = new Set(main.querySelectorAll(sel));
  var blocks = Array.from(set).filter(function (el) {
    for (var p = el.parentElement; p && p !== main; p = p.parentElement) if (set.has(p)) return false;
    return true;
  });

  var ROW = 9;                 /* px per redraw step: chunky scanlines */
  var MAX_TOTAL = 4200;        /* never make anyone wait longer than this */
  var plan = blocks.map(function (el) {
    var h = el.getBoundingClientRect().height || 20;
    var heavy = !!el.querySelector("img, svg, pre.mermaid") || /^(IMG|FIGURE|PRE|TABLE)$/.test(el.tagName);
    return { el: el, steps: Math.max(3, Math.round(h / ROW)), ms: Math.min(1500, 140 + h * (heavy ? 2.4 : 1.3)) };
  });
  var total = plan.reduce(function (t, b) { return t + b.ms; }, 0);
  var k = total > MAX_TOTAL ? MAX_TOTAL / total : 1;

  if (cmd) cmd.textContent = "REGEN";
  var t = 120, last = null;
  plan.forEach(function (b) {
    var d = b.ms * k;
    var a = b.el.animate(
      [{ clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)" }],
      { duration: d, delay: t, easing: "steps(" + b.steps + ", end)", fill: "both" });
    last = a;
    t += d * 0.85;             /* blocks overlap a little, like a busy bus */
  });
  done();                      /* blocks are clipped by their own animations from here on */
  if (last) last.finished.then(function () { if (cmd) cmd.textContent = ""; }).catch(function () {});

  function skip() {
    document.getAnimations().forEach(function (a) { try { a.finish(); } catch (e) {} });
    if (cmd) cmd.textContent = "";
  }
  ["keydown", "mousedown", "touchstart"].forEach(function (ev) {
    window.addEventListener(ev, skip, { once: true, passive: true });
  });
})();
</script>
{{ if .Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: true, theme: "dark", themeVariables: { fontFamily: "monospace" } });
</script>
{{ end }}
