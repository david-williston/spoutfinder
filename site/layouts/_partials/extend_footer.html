<div class="cmdline">
  <span aria-hidden="true">Command: <span id="cmdtext"></span><span class="cursor"></span></span>
  <span class="cmd-right"><button type="button" id="snd" aria-pressed="true" title="Toggle the modem sound">[SND ON]</button><span class="coords" id="coords" aria-hidden="true">X: 0000.0000  Y: 0000.0000  Z: 0.0000</span></span>
</div>
<script>
  window.CMD = { lock: false, el: document.getElementById("cmdtext"),
    set: function (t, modem) { if (this.el && (modem || !this.lock)) this.el.textContent = t; } };
</script>
<script>
  (function () {
    var el = document.getElementById("coords");
    document.addEventListener("mousemove", function (e) {
      var x = (e.clientX / 8).toFixed(4).padStart(9, "0");
      var y = ((window.innerHeight - e.clientY) / 8).toFixed(4).padStart(9, "0");
      el.textContent = "X: " + x + "  Y: " + y + "  Z: 0.0000";
    });
  })();
</script>
<script>
(function () {
  var root = document.documentElement;
  if (!root.classList.contains("x486")) return;
  var main = document.querySelector("main.main");
  function done() { root.classList.add("x486-run"); CMD.set(""); }
  if (!main) { done(); return; }

  /* top-level blocks of whatever this page is made of */
  var sel = [".page-header > *", ".post-header > *", ".post-content > *", ".home-info > *",
             ".post-entry", ".post-meta", ".toc", ".breadcrumbs"].join(",");
  var set = new Set(main.querySelectorAll(sel));
  var blocks = Array.from(set).filter(function (el) {
    for (var p = el.parentElement; p && p !== main; p = p.parentElement) if (set.has(p)) return false;
    return true;
  });

  var ROW = 9;                 /* px per redraw step: chunky scanlines */
  var MAX_TOTAL = 4200;        /* never make anyone wait longer than this */
  var plan = blocks.map(function (el) {
    var h = el.getBoundingClientRect().height || 20;
    var heavy = !!el.querySelector("img, svg, pre.mermaid") || /^(IMG|FIGURE|PRE|TABLE)$/.test(el.tagName);
    return { el: el, steps: Math.max(3, Math.round(h / ROW)), ms: Math.min(1500, 140 + h * (heavy ? 2.4 : 1.3)) };
  });
  var total = plan.reduce(function (t, b) { return t + b.ms; }, 0);
  var k = total > MAX_TOTAL ? MAX_TOTAL / total : 1;

  CMD.set("REGEN");
  var t = 120, last = null;
  plan.forEach(function (b) {
    var d = b.ms * k;
    var a = b.el.animate(
      [{ clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)" }],
      { duration: d, delay: t, easing: "steps(" + b.steps + ", end)", fill: "both" });
    last = a;
    t += d * 0.85;             /* blocks overlap a little, like a busy bus */
  });
  done();                      /* blocks are clipped by their own animations from here on */
  if (last) last.finished.then(function () { CMD.set(""); }).catch(function () {});

  function skip() {
    document.getAnimations().forEach(function (a) { try { a.finish(); } catch (e) {} });
    CMD.set("");
  }
  ["keydown", "mousedown", "touchstart"].forEach(function (ev) {
    window.addEventListener(ev, skip, { once: true, passive: true });
  });
})();
</script>

<script>
/* Modem sound on the first visit of a session: dial tone, DTMF dialling, ringback, answer tone, handshake.
   All synthesised with Web Audio (no samples). Browsers keep audio locked until the first click or key,
   so if it is still locked the call is placed on that first interaction. */
(function () {
  var btn = document.getElementById("snd");
  var store = function (k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} };
  var sess = function (k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) {} };
  var muted = store("modem") === "off";
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null, timers = [], playing = false;
  function label() { btn.textContent = muted ? "[SND OFF]" : "[SND ON]"; btn.setAttribute("aria-pressed", String(!muted)); }
  label();

  function stop() {
    timers.forEach(clearTimeout); timers = [];
    if (master) { try { master.gain.cancelScheduledValues(0); master.gain.setValueAtTime(0, ctx.currentTime); } catch (e) {} }
    if (ctx) { try { ctx.close(); } catch (e) {} ctx = null; }
    playing = false; CMD.lock = false; CMD.set("", true);
  }
  btn.addEventListener("click", function (ev) {
    ev.stopPropagation();
    muted = !muted; store("modem", muted ? "off" : "on"); label();
    if (muted) stop(); else { sess("modemPlayed", null); call(); }
  });

  var DTMF = { "1": [697, 1209], "2": [697, 1336], "3": [697, 1477], "4": [770, 1209], "5": [770, 1336],
               "6": [770, 1477], "7": [852, 1209], "8": [852, 1336], "9": [852, 1477], "0": [941, 1336] };

  function tone(freqs, t, dur, gain) {
    freqs.forEach(function (f) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(gain, t + 0.008); g.gain.setValueAtTime(gain, t + dur - 0.008); g.gain.linearRampToValueAtTime(0, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
    });
  }
  function noiseSource() {
    var len = ctx.sampleRate * 2, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var s = ctx.createBufferSource(); s.buffer = b; s.loop = true; return s;
  }

  function schedule() {
    var t0 = ctx.currentTime + 0.15, t;
    master = ctx.createGain(); master.gain.value = 0.22;
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3400;
    var hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 300;
    master.connect(hp); hp.connect(lp); lp.connect(ctx.destination);

    /* 1. dial tone: 350 + 440 Hz */
    tone([350, 440], t0, 1.5, 0.5);
    /* 2. dialling 555-0486 as DTMF */
    t = t0 + 1.6;
    "5550486".split("").forEach(function (d) { tone(DTMF[d], t, 0.08, 0.45); t += 0.17; });
    /* 3. ringback: 440 + 480 Hz */
    t += 0.5; var ring = t;
    tone([440, 480], t, 1.1, 0.35); tone([440, 480], t + 1.7, 1.1, 0.35);
    /* 4. answer tone: 2100 Hz */
    t = ring + 3.1; var ans = t;
    tone([2100], t, 1.3, 0.5);
    /* 5. handshake: FSK chirps, then a warbling screech over noise */
    t += 1.6; var hs = t;
    var f = 0;
    for (var i = 0; i < 14; i++) { tone([i % 2 ? 2400 : 1200], t, 0.07, 0.4); t += 0.07; }
    t += 0.15;
    var osc = ctx.createOscillator(), og = ctx.createGain();
    var set = [980, 1180, 1650, 1800, 2100, 2250, 2400, 1100, 1500, 2700, 880];
    var span = 4.6, step = 0.045;
    og.gain.setValueAtTime(0, t); og.gain.linearRampToValueAtTime(0.32, t + 0.3);
    og.gain.setValueAtTime(0.32, t + span - 0.8); og.gain.linearRampToValueAtTime(0, t + span);
    for (var x = 0; x < span; x += step) osc.frequency.setValueAtTime(set[Math.floor(Math.random() * set.length)] + (x < 2 ? 0 : 120), t + x);
    osc.connect(og); og.connect(master); osc.start(t); osc.stop(t + span + 0.05);
    var ns = noiseSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain();
    bp.type = "bandpass"; bp.Q.value = 1.2;
    for (var y = 0; y < span; y += 0.35) bp.frequency.setValueAtTime(700 + Math.random() * 2400, t + y);
    ng.gain.setValueAtTime(0, t); ng.gain.linearRampToValueAtTime(0.5, t + 0.4); ng.gain.setValueAtTime(0.5, t + span - 1); ng.gain.linearRampToValueAtTime(0, t + span);
    ns.connect(bp); bp.connect(ng); ng.connect(master); ns.start(t); ns.stop(t + span + 0.05);
    t += span;
    /* 6. last blip of carrier, then quiet */
    tone([1200, 2400], t, 0.25, 0.3);
    var end = t + 0.3;

    /* the command line follows along */
    var base = t0 - ctx.currentTime;
    var say = function (when, text) { timers.push(setTimeout(function () { CMD.set(text, true); }, (when - ctx.currentTime + base * 0) * 1000)); };
    CMD.lock = true;
    say(t0, "ATDT 555-0486");
    say(ring, "ATDT 555-0486  RINGING");
    say(ans, "CARRIER DETECTED");
    say(hs, "NEGOTIATING...");
    say(end, "CONNECT 14400");
    timers.push(setTimeout(function () { CMD.lock = false; CMD.set("", true); playing = false; }, (end - ctx.currentTime + 2.5) * 1000));
  }

  function start() {
    if (playing || muted) return;
    playing = true; sess("modemPlayed", "1");
    schedule();
  }
  function call() {
    if (muted || !AC || sess("modemPlayed")) return;
    ctx = ctx || new AC();
    if (ctx.state === "running") return start();
    ctx.resume().catch(function () {});
    /* locked: wait for the first real interaction, but not forever */
    var armed = Date.now(), go = function () {
      if (muted || sess("modemPlayed") || Date.now() - armed > 120000) return;
      (ctx || (ctx = new AC())).resume().then(start).catch(function () {});
    };
    ["pointerdown", "keydown", "touchstart"].forEach(function (e) { window.addEventListener(e, go, { once: true }); });
    setTimeout(function () { if (ctx && ctx.state === "running") start(); }, 400);
  }
  call();
})();
</script>
