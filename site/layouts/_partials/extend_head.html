<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<script>
  /* 486 mode: hide page blocks until the redraw script reveals them (skipped for reduced motion) */
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("x486");
</script>
<noscript><style>.x486 .main > * { visibility: visible !important; }</style></noscript>
<script>
  /* first visit of a session: the dial-up screen covers the page until it is connected */
  try { if (!sessionStorage.getItem("connected") && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("dialup"); } catch (e) {}
</script>
